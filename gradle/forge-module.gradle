apply plugin: 'net.neoforged.moddev.legacyforge'
legacyForge { version = '1.20.1-47.4.16' }
sourceSets.main.java.srcDir(rootProject.file('contracts/src/native/java'))
dependencies {
    api project(':contracts')
    modImplementation('appeng:appliedenergistics2-forge:15.4.10') { transitive = false }
    testImplementation 'com.google.guava:guava:31.1-jre'
    testImplementation 'com.google.code.gson:gson:2.10.1'
}
tasks.named('jar') {
    dependsOn ':contracts:classes'
    from(project(':contracts').sourceSets.main.output)
    archiveClassifier = 'dev'
    from(rootProject.file('LICENSES')) { into 'META-INF/licenses' }
}
tasks.named('processResources') {
    inputs.property('version', project.version)
    filesMatching('META-INF/mods.toml') { expand(version: project.version) }
}
tasks.register('verifyRelease') {
    dependsOn tasks.named('reobfJar')
    doLast {
        def jarFile = tasks.named('reobfJar').get().archiveFile.get().asFile
        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            if (!zip.getEntry('META-INF/mods.toml') || !zip.getEntry('pack.mcmeta')) {
                throw new GradleException('Missing release metadata')
            }
            if (project.name == 'server') {
                if (!zip.getEntry('web/index.html') || !zip.getEntry('META-INF/jarjar/metadata.json')) {
                    throw new GradleException('Missing bundled web or SQLite dependency')
                }
                def embedded = zip.entries().findAll { it.name.startsWith('META-INF/jarjar/') && it.name.endsWith('.jar') }
                if (embedded.size() != 1) throw new GradleException('Expected one SQLite Forge adapter')
                def digest = java.security.MessageDigest.getInstance('SHA-256')
                zip.getInputStream(embedded[0]).withCloseable { input ->
                    byte[] buffer = new byte[65536]
                    int count
                    while ((count = input.read(buffer)) != -1) digest.update(buffer, 0, count)
                }
                if (digest.digest().encodeHex().toString() != '9d13d1a0cab35216d3a0f7f1dc46f49e90f1f9d6421b8a872427e26b58336e40') {
                    throw new GradleException('Unexpected SQLite Forge adapter fingerprint')
                }
            }
            zip.entries().each { entry ->
                if (project.name == 'server' && (entry.name.startsWith('local/ae2dashboard/exporter/') || entry.name.startsWith('net/minecraft/client/') || entry.name.startsWith('org/sqlite/'))) {
                    throw new GradleException('Client code or an unpacked JDBC driver in server JAR: ' + entry.name)
                }
                if (entry.name.endsWith('.class')) {
                    def stream = new DataInputStream(zip.getInputStream(entry))
                    try {
                        if (stream.readInt() != -889275714) throw new GradleException('Invalid class')
                        stream.readUnsignedShort()
                        if (stream.readUnsignedShort() > 61) throw new GradleException('Requires Java newer than 17: ' + entry.name)
                    } finally { stream.close() }
                }
            }
        }
    }
}
tasks.named('check') { dependsOn tasks.named('verifyRelease') }
