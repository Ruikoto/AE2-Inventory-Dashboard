plugins {
    id 'base'
    id 'net.neoforged.moddev.legacyforge' version '2.0.86' apply false
}
allprojects {
    group = 'local.ae2dashboard'
    version = rootProject.property('modVersion')
    repositories {
        mavenCentral()
        maven { url = 'https://modmaven.dev'; content { includeGroup 'appeng' } }
    }
}
subprojects {
    apply plugin: 'java-library'
    java.toolchain.languageVersion = JavaLanguageVersion.of(17)
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
    dependencies {
        compileOnly 'org.jetbrains:annotations:26.0.1'
        testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
    test { useJUnitPlatform(); maxHeapSize = '1g' }
    dependencyLocking { lockAllConfigurations() }
    tasks.withType(Jar).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
        from(rootProject.file('LICENSE'))
        from(rootProject.file('NOTICE'))
        manifest.attributes('Implementation-Version': project.version)
    }
}
tasks.named('build') { dependsOn subprojects.collect { it.tasks.named('build') } }
