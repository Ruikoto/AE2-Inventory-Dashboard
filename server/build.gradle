apply from: rootProject.file('gradle/forge-module.gradle')
base { archivesName = 'ae2-inventory-dashboard' }
repositories {
    ivy {
        name = 'SQLiteForgeRelease'
        url = 'https://github.com/kosmolot-mods/minecraft-sqlite-jdbc/releases/download'
        patternLayout { artifact '[revision]/[artifact]-[revision]-[classifier].[ext]' }
        metadataSources { artifact() }
        content { includeModule 'org.kosmolot.minecraft', 'sqlite-jdbc' }
    }
}
// GitHub release assets have no Maven version index; resolve the fixed binary while retaining its Jar-in-Jar range.
configurations.jarJar.resolutionStrategy.force 'org.kosmolot.minecraft:sqlite-jdbc:3.36.0.3+20211227'
dependencies {
    compileOnly 'org.xerial:sqlite-jdbc:3.36.0.3'
    jarJar('org.kosmolot.minecraft:sqlite-jdbc:3.36.0.3+20211227:all@jar') {
        version { strictly '[3.36.0.3+20211227,3.37)'; prefer '3.36.0.3+20211227' }
        transitive = false
    }
}
sourceSets {
    test { java.setSrcDirs([]) }
    core { java { srcDir 'src/main/java'; exclude 'local/ae2dashboard/forge/**' } }
    coreTest { java.srcDir 'src/test/java'; compileClasspath += sourceSets.core.output; runtimeClasspath += sourceSets.core.output }
    nativeTest { java.srcDir 'src/nativeTest/java'; compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath; runtimeClasspath += sourceSets.main.output + sourceSets.main.compileClasspath }
}
dependencies {
    coreImplementation project(':contracts')
    coreImplementation 'org.xerial:sqlite-jdbc:3.36.0.3'
    coreImplementation 'org.slf4j:slf4j-api:1.7.36'
    coreTestImplementation project(':contracts')
    coreTestImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    coreTestImplementation 'org.xerial:sqlite-jdbc:3.36.0.3'
    coreTestRuntimeOnly 'org.slf4j:slf4j-simple:1.7.36'
    coreTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    nativeTestImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    nativeTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test', Test) {
    testClassesDirs = sourceSets.coreTest.output.classesDirs
    classpath = sourceSets.coreTest.runtimeClasspath
    useJUnitPlatform()
}
tasks.register('coreTest') { dependsOn 'test' }
tasks.named('check') { dependsOn 'coreTest' }
tasks.register('nativeTest', Test) {
    testClassesDirs = sourceSets.nativeTest.output.classesDirs
    classpath = sourceSets.nativeTest.runtimeClasspath
    useJUnitPlatform()
}
tasks.named('check') { dependsOn 'nativeTest' }
tasks.named('processCoreResources') {
    dependsOn 'buildWeb'
    from(rootProject.file('web/dist')) { into 'web' }
}
tasks.register('runDemo', JavaExec) {
    dependsOn 'coreTestClasses'
    classpath = sourceSets.coreTest.runtimeClasspath
    mainClass = 'local.ae2dashboard.LocalHarness'
    workingDir rootProject.projectDir
}
tasks.register('performanceTest', JavaExec) {
    dependsOn 'coreTestClasses'
    classpath = sourceSets.coreTest.runtimeClasspath
    mainClass = 'local.ae2dashboard.PerformanceHarness'
    workingDir rootProject.projectDir
    args providers.gradleProperty('workload').getOrElse('large')
    maxHeapSize = '1g'
}
tasks.named('reobfJar') { archiveClassifier = 'server' }
def npm = System.getProperty('os.name').toLowerCase().contains('windows') ? 'npm.cmd' : 'npm'
tasks.register('buildWeb', Exec) {
    workingDir rootProject.file('web')
    commandLine npm, 'run', 'build'
    inputs.dir(rootProject.file('web/src'))
    inputs.files(rootProject.file('web/package-lock.json'), rootProject.file('web/vite.config.ts'))
    outputs.dir(rootProject.file('web/dist'))
}
tasks.named('processResources') {
    dependsOn 'buildWeb'
    from(rootProject.file('web/dist')) { into 'web' }
}
